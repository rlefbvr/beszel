# Docs: https://beszel.dev/guide/hub-installation
# Env vars: https://beszel.dev/guide/environment-variables

services:
  beszel:
    # image of this fork, published by the docker-images workflow on each release tag
    # (pin a version such as :0.20.0-fork.1 to choose when to update)
    image: "ghcr.io/rlefbvr/beszel/beszel:latest"
    container_name: "beszel"
    restart: unless-stopped
    environment:
      # public URL of the hub, used in notification links
      APP_URL: "https://beszel.example.com"
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
    # healthcheck:
    #   test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s
